<!DOCTYPE html>
<html lang="sv" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VistMe — Global Nomad Map</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
    #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1; }
    .leaflet-tile-pane { filter: brightness(0.85) contrast(1.1); }
    .sheet-transition { transition: transform 0.3s ease-in-out; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans relative">

  <header class="absolute top-0 left-0 right-0 z-10 bg-slate-900 p-4 border-b border-slate-800 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📌</span>
        <h1 class="font-bold text-lg text-indigo-400 hidden sm:inline">VistMe</h1>
      </div>
      <button onclick="alert('Logga in')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium cursor-pointer">Logga in</button>
    </div>
  </header>

  <div id="map"></div>

  <button id="add-btn" class="fixed bottom-6 right-6 z-10 bg-indigo-600 hover:bg-indigo-500 text-white p-4 rounded-full shadow-2xl font-bold cursor-pointer">
    📝 Lägg till Tip
  </button>

  <script>
    console.log('✅ VistMe startar');

    const map = L.map('map').setView([20, 0], 2);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    L.marker([59.33, 18.07]).bindPopup('Stockholm - Test Marker').addTo(map);
    
    console.log('✅ Karta laddad');
    
    document.getElementById('add-btn').addEventListener('click', () => {
      alert('Lägg till Tip-funktionen kommer snart!');
    });
  </script>

</body>
</html>

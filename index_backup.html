<!DOCTYPE html>
<html lang="sv" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VistMe — Global Nomad Map</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
    #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1; }
    .leaflet-tile-pane { filter: brightness(0.85) contrast(1.1); }
    .sheet-transition { transition: max-height 0.3s ease-in-out; }
    .drag-handle { cursor: grab; user-select: none; }
    .drag-handle:active { cursor: grabbing; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans relative">

  <header class="absolute top-0 left-0 right-0 z-10 bg-slate-900 p-4 border-b border-slate-800 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📌</span>
        <h1 class="font-bold text-lg text-indigo-400 hidden sm:inline">VistMe</h1>
      </div>
      <button onclick="alert('Logga in')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium cursor-pointer">Logga in</button>
    </div>
  </header>

  <div id="map"></div>

  <button id="add-btn" class="fixed bottom-6 right-6 z-10 bg-indigo-600 hover:bg-indigo-500 text-white p-4 rounded-full shadow-2xl font-bold cursor-pointer">
    📝 Lägg till Tip
  </button>

  <!-- Bottom Sheet för reviews -->
  <div id="bottom-sheet" class="fixed inset-x-0 bottom-0 z-20 bg-slate-900 border-t border-slate-800 rounded-t-3xl shadow-2xl sheet-transition transform translate-y-full overflow-y-auto" style="max-height: 65vh;">
    <!-- Drag Handle -->
    <div class="drag-handle w-full bg-slate-800/50 py-3 flex justify-center sticky top-0 z-30">
      <div class="w-12 h-1.5 bg-slate-700 rounded-full"></div>
    </div>

    <!-- Content -->
    <div class="max-w-7xl mx-auto px-6 pb-6">
      <h2 id="location-title" class="text-2xl font-bold mb-2">Välj en plats</h2>
      <p id="location-count" class="text-slate-400 text-sm mb-4">Klicka på en nål för att se vilka som har varit här</p>
      
      <!-- Lista över resenärer -->
      <div id="travelers-list" class="space-y-3">
        <!-- Resenärer kommer listas här -->
      </div>
    </div>
  </div>

  <script>
    console.log('✅ VistMe startar');

    let isDragging = false;
    let startY = 0;
    const sheet = document.getElementById('bottom-sheet');
    const handle = sheet.querySelector('.drag-handle');

    // Drag-funktionalitet
    handle.addEventListener('mousedown', startDrag);
    handle.addEventListener('touchstart', startDrag);

    function startDrag(e) {
      isDragging = true;
      startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
      sheet.classList.remove('sheet-transition');
    }

    document.addEventListener('mousemove', dragSheet);
    document.addEventListener('touchmove', dragSheet);

    function dragSheet(e) {
      if (!isDragging) return;
      const currentY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
      const diff = startY - currentY;
      const currentHeight = parseFloat(sheet.style.maxHeight) || 65;
      const newHeight = Math.min(95, Math.max(30, currentHeight + (diff / window.innerHeight) * 100));
      sheet.style.maxHeight = newHeight + 'vh';
      startY = currentY;
    }

    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
      sheet.classList.add('sheet-transition');
      
      const height = parseFloat(sheet.style.maxHeight) || 65;
      if (height > 80) sheet.style.maxHeight = '95vh';
      else if (height > 45) sheet.style.maxHeight = '65vh';
      else closeSheet();
    }

    function closeSheet() {
      sheet.classList.add('translate-y-full');
    }

    // Test-data för resenärer på en plats
    const testTravelers = [
      { name: 'Emma', review: 'Fin utsikt över havet! Rekommenderas.' },
      { name: 'Johan', review: 'Bra restaurang i närheten. Testa fisksoppan!' },
      { name: 'Lisa', review: 'Mysigt litet café. Perfekt för att arbeta.' }
    ];

    // Visa resenärer när man klickar på marker
    function showTravelers(location) {
      sheet.classList.remove('translate-y-full');
      sheet.style.maxHeight = '65vh';
      
      document.getElementById('location-title').innerText = location;
      document.getElementById('location-count').innerText = `${testTravelers.length} resenär(er) har varit här`;

      const list = document.getElementById('travelers-list');
      list.innerHTML = '';

      testTravelers.forEach((traveler, index) => {
        // Header
        const header = document.createElement('div');
        header.className = 'bg-slate-800/60 border border-slate-700/60 rounded-lg p-3 cursor-pointer hover:bg-slate-800 transition';
        header.innerHTML = `<div class="flex justify-between items-center">
          <span class="font-semibold">👤 ${traveler.name}</span>
          <span class="text-xs text-slate-400">►</span>
        </div>`;
        
        list.appendChild(header);

        // Review (dölj initialt)
        const review = document.createElement('div');
        review.className = 'hidden bg-slate-900/40 border-l-2 border-indigo-500 ml-4 pl-4 py-2 text-slate-300 text-sm rounded mb-2';
        review.innerHTML = `<p>${traveler.review}</p>`;
        list.appendChild(review);

        // Toggle-funktion
        header.addEventListener('click', () => {
          review.classList.toggle('hidden');
          header.querySelector('span:last-child').innerText = review.classList.contains('hidden') ? '►' : '▼';
        });
      });
    }

    // Initiera kartan
    const map = L.map('map').setView([20, 0], 2);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Test-markers
    L.marker([59.33, 18.07]).bindPopup('Stockholm').on('click', () => showTravelers('Stockholm')).addTo(map);
    L.marker([48.86, 2.35]).bindPopup('Paris').on('click', () => showTravelers('Paris')).addTo(map);
    L.marker([51.51, -0.13]).bindPopup('London').on('click', () => showTravelers('London')).addTo(map);
    
    console.log('✅ Karta laddad med resenärer');
    
    document.getElementById('add-btn').addEventListener('click', () => {
      alert('Lägg till Tip-funktionen kommer snart!');
    });
  </script>

</body>
</html>

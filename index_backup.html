<!DOCTYPE html>
<html lang="sv" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VistMe — Global Nomad Map</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0f19;
    }

    #map {
      height: 100vh;
      width: 100vw;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #0b0f19;
    }

    .leaflet-tile-pane {
      filter: brightness(0.65) invert(1) contrast(1.5) hue-rotate(190deg) saturate(0.8);
    }

    .sheet-transition { 
      transition: transform 0.3s ease-in-out; 
    }

    #bottom-sheet {
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-full w-full relative">

  <!-- Header / Top Bar -->
  <header class="absolute top-0 left-0 right-0 z-10 bg-gradient-to-b from-slate-900/95 to-slate-900/70 backdrop-blur-sm p-4 border-b border-slate-800/50 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📌</span>
        <h1 class="font-bold text-lg tracking-wide bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent hidden sm:inline">VistMe</h1>
      </div>
      
      <div id="auth-section" class="flex items-center gap-2 sm:gap-4">
        <button id="login-btn" onclick="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition shadow-lg flex items-center gap-2 cursor-pointer">
          <span>Logga in</span>
        </button>
        
        <div id="user-profile" class="hidden flex items-center gap-2 sm:gap-3">
          <img id="header-avatar" src="" alt="Avatar" class="w-8 h-8 rounded-full border border-indigo-500/50 object-cover cursor-pointer hover:border-indigo-400 transition shadow-md" onclick="openProfileModal()" title="Din profil">
          <button onclick="logout()" class="text-xs text-slate-400 hover:text-white transition px-1 sm:px-2 cursor-pointer">Logga ut</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Karta -->
  <div id="map"></div>

  <!-- Flytande Action Button -->
  <button id="action-btn" onclick="openPinModal()" class="fixed bottom-6 right-6 z-10 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white p-4 rounded-full shadow-2xl flex items-center gap-2 font-bold transition transform active:scale-95 border border-indigo-400/30 cursor-pointer">
    <span class="text-xl">📝</span>
    <span class="hidden sm:inline">Lägg till Tip</span>
  </button>

  <!-- Bottom Sheet / Modal -->
  <div id="bottom-sheet" class="fixed inset-x-0 bottom-0 z-20 bg-slate-900 border-t border-slate-800 rounded-t-3xl shadow-2xl sheet-transition transform translate-y-full overflow-y-auto" style="max-height: 98vh;">
    <!-- Drag Handle -->
    <div class="w-full bg-slate-800/50 py-3 flex justify-center sticky top-0 z-30 cursor-grab active:cursor-grabbing">
      <div class="w-12 h-1.5 bg-slate-700 rounded-full"></div>
    </div>

    <!-- Content Wrapper med max-width -->
    <div class="max-w-7xl mx-auto px-6 pb-6 w-full">
    <!-- Visar recensioner för en plats -->
    <div id="sheet-content">
      <h2 id="sheet-title" class="text-2xl font-bold mb-1">Välj en plats</h2>
      <p id="sheet-subtitle" class="text-slate-400 text-sm mb-4">Klicka på en nål för att läsa tips</p>
      <div id="reviews-list" class="space-y-4"></div>
    </div>

    <!-- Formulär: Lägg till / Redigera nål -->
    <div id="pin-form" class="hidden space-y-4">
      <h2 id="form-title" class="text-xl font-bold">Lägg till / Redigera din Tip</h2>
      <input type="text" id="location-input" placeholder="Stad/Plats (t.ex. Larnaca)" class="w-full bg-gradient-to-b from-slate-900/95 to-slate-900/70 border border-slate-700/50 rounded-lg p-4 text-white focus:outline-none focus:border-indigo-500 text-base font-medium shadow-md">
      
      <div class="relative">
        <textarea id="review-input" maxlength="1000" rows="5" oninput="updateCharCount()" placeholder="Skriv ditt tip (Max 1 000 tecken)..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500"></textarea>
        <div class="text-right text-xs text-slate-500 mt-1">
          <span id="char-count">0</span> / 1000 tecken
        </div>
      </div>

      <div class="flex gap-3">
        <button onclick="savePin()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition cursor-pointer">Spara Tip</button>
        <button onclick="closeBottomSheet()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-3 rounded-xl font-medium transition cursor-pointer">Avbryt</button>
      </div>
    </div>
      </div>
    </div>
  </div>

  <!-- Profil Modal -->
  <div id="profile-modal" class="fixed inset-0 z-30 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900/95 border border-slate-700 w-full max-w-sm rounded-2xl shadow-2xl flex flex-col overflow-hidden p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-indigo-300">Din Profil</h2>
        <button onclick="closeProfileModal()" class="text-slate-400 hover:text-white text-2xl p-1 cursor-pointer">✕</button>
      </div>
      
      <div class="space-y-5 overflow-y-auto flex-1 pr-2">
        <!-- Profilbild & Info -->
        <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 flex items-center gap-4">
          <img id="profile-modal-avatar" src="https://via.placeholder.com/80" alt="Avatar" class="w-20 h-20 rounded-full border-2 border-indigo-400/50 object-cover cursor-pointer hover:opacity-80 transition flex-shrink-0" onclick="openImageModal(this.src)" title="Klicka för att förstora">
          <p class="text-xs text-slate-300">Välj din personliga symbol för kartan.</p>
        </div>

        <!-- Smeknamn -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-2">Smeknamn / Namn (Valfritt)</label>
          <input type="text" id="profile-nickname" placeholder="t.ex. NomadJasmin" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500 text-sm">
        </div>

        <!-- Emoji Picker -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-3">Välj din karta-symbol:</label>
          <div id="emoji-picker-container" class="grid grid-cols-4 gap-3"></div>
          <input type="hidden" id="selected-pin-emoji" value="📍">
        </div>
      </div>

      <div class="flex gap-3 mt-6 pt-4 border-t border-slate-700">
        <button onclick="saveProfile()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-lg font-bold transition cursor-pointer text-sm shadow-lg">Spara Profil</button>
        <button onclick="closeProfileModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-3 rounded-lg font-medium transition cursor-pointer text-sm">Stäng</button>
      </div>
    </div>
  </div>

  <!-- Image Modal (för större profilbild) -->
  <div id="image-modal" class="fixed inset-0 z-40 bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="closeImageModal()">
    <div class="relative max-w-md w-full flex flex-col items-center">
      <img id="modal-big-img" src="" alt="Stor profilbild" class="w-64 h-64 rounded-full border-4 border-indigo-500/50 shadow-2xl object-cover">
      <p class="text-slate-400 text-xs mt-4">Klicka var som helst för att stänga</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uzadvxbtgrkmuagjtkfr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_XGnBn__01QbbtlfOBOv2ng_EM8LrAXi';
    
    let supabaseClient = null;
    let map = null;
    let currentUser = null;
    let userProfile = null;
    let userAvatarUrl = '';
    let markersLayer = null;

    const availableEmojis = ['📍', '📌', '✈️', '⭐', '🚀', '🏕️', '☕', '🌴'];

    if (SUPABASE_URL && SUPABASE_ANON_KEY) {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const southWest = L.latLng(-85, -180);
      const northEast = L.latLng(85, 180);
      const bounds = L.latLngBounds(southWest, northEast);

      map = L.map('map', { 
        zoomControl: false,
        maxBounds: bounds,
        maxBoundsViscosity: 1.0,
        bounceAtZoomLimits: false
      }).setView([20, 0], 2);
      
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 17,
        maxNativeZoom: 15,
        minZoom: 2,
        attribution: 'Tiles &copy; Esri'
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      setTimeout(() => { map.invalidateSize(); }, 100);

      buildEmojiPicker();

      if (supabaseClient) {
        // Lyssna på auth-ändringar
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
          if (session) {
            currentUser = session.user;
            userAvatarUrl = session.user.user_metadata?.avatar_url || session.user.user_metadata?.picture || '';
            
            console.log('✅ Inloggad:', currentUser.email);
            
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('user-profile').classList.remove('hidden');
            
            if (userAvatarUrl) {
              document.getElementById('header-avatar').src = userAvatarUrl;
            }

            await fetchUserProfile(session.user.id);
            loadPins();
          } else {
            currentUser = null;
            userAvatarUrl = '';
            userProfile = null;
            document.getElementById('login-btn').classList.remove('hidden');
            document.getElementById('user-profile').classList.add('hidden');
            console.log('❌ Utloggad');
          }
        });

        // Kolla om det redan finns en session
        checkUserSession();
      }
    });

    async function checkUserSession() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          currentUser = session.user;
          userAvatarUrl = session.user.user_metadata?.avatar_url || session.user.user_metadata?.picture || '';
          document.getElementById('login-btn').classList.add('hidden');
          document.getElementById('user-profile').classList.remove('hidden');
          if (userAvatarUrl) {
            document.getElementById('header-avatar').src = userAvatarUrl;
          }
          await fetchUserProfile(session.user.id);
        } else {
          currentUser = null;
        }
        // Ladda pins för alla (inloggade och ologgade)
        loadPins();
      } catch (err) {
        console.error('Sessionsfel:', err);
      }
    }

    function buildEmojiPicker() {
      const container = document.getElementById('emoji-picker-container');
      if (!container) return;
      container.innerHTML = '';
      availableEmojis.forEach(emoji => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'emoji-option-btn text-4xl p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg transition cursor-pointer flex items-center justify-center hover:scale-110 transform';
        btn.innerText = emoji;
        btn.onclick = () => selectEmoji(emoji);
        container.appendChild(btn);
      });
    }

    function selectEmoji(emoji) {
      document.getElementById('selected-pin-emoji').value = emoji;
      document.querySelectorAll('.emoji-option-btn').forEach(btn => {
        if (btn.innerText === emoji) {
          btn.classList.add('border-indigo-400', 'bg-indigo-600/40', 'ring-2', 'ring-indigo-500');
          btn.classList.remove('bg-slate-800');
        } else {
          btn.classList.remove('border-indigo-400', 'bg-indigo-600/40', 'ring-2', 'ring-indigo-500');
          btn.classList.add('bg-slate-800');
        }
      });
    }

    async function fetchUserProfile(userId) {
      try {
        const { data, error } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', userId)
          .single();
        
        if (error) {
          if (error.code === 'PGRST116') {
            // Profil finns inte - skapa en ny
            console.log('📋 Skapar ny profil...');
            const { data: newProfile, error: insertError } = await supabaseClient.from('profiles').insert({
              id: userId,
              nickname: 'Anonym Resenär',
              pin_emoji: '📍',
              avatar_url: userAvatarUrl || '',
              updated_at: new Date().toISOString()
            }).select().single();

            if (insertError) {
              console.error('❌ Fel vid profilskapande:', insertError);
            } else {
              userProfile = newProfile;
              console.log('✅ Profil skapad!', userProfile);
            }
          } else {
            console.error('❌ Profil-fel:', error);
          }
        } else if (data) {
          userProfile = data;
          console.log('✅ Profil laddad:', userProfile);
        }
      } catch (err) {
        console.error('❌ Profil-fel:', err);
      }
    }

    async function loginWithGoogle() {
      if (!supabaseClient) return alert('Supabase är inte konfigurerat!');
      const { error } = await supabaseClient.auth.signInWithOAuth({ 
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      if (error) alert('Inloggning misslyckades: ' + error.message);
    }

    async function logout() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
        currentUser = null;
        userProfile = null;
        window.location.reload();
      }
    }

    function openProfileModal() {
      if (!currentUser) {
        alert('Du måste logga in först!');
        return;
      }

      if (userAvatarUrl) {
        document.getElementById('profile-modal-avatar').src = userAvatarUrl;
      }

      if (userProfile) {
        document.getElementById('profile-nickname').value = userProfile.nickname || '';
        const currentEmoji = userProfile.pin_emoji || '📍';
        selectEmoji(currentEmoji);
      } else {
        document.getElementById('profile-nickname').value = '';
        selectEmoji('📍');
      }

      document.getElementById('profile-modal').classList.remove('hidden');
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').classList.add('hidden');
    }

    function openImageModal(imgSrc) {
      if (!imgSrc) return;
      document.getElementById('modal-big-img').src = imgSrc;
      document.getElementById('image-modal').classList.remove('hidden');
    }

    function closeImageModal() {
      document.getElementById('image-modal').classList.add('hidden');
    }

    async function saveProfile() {
      if (!currentUser) return;

      const nickname = document.getElementById('profile-nickname').value.trim();
      const pinEmoji = document.getElementById('selected-pin-emoji').value;

      try {
        const { error } = await supabaseClient.from('profiles').upsert({
          id: currentUser.id,
          nickname: nickname || 'Anonym Resenär',
          pin_emoji: pinEmoji,
          avatar_url: userAvatarUrl || '',
          updated_at: new Date().toISOString()
        });

        if (error) {
          console.error('❌ Profil-sparfel:', error);
          alert('Kunde inte spara profil: ' + error.message);
        } else {
          console.log('✅ Profil sparad!');
          userProfile = { 
            id: currentUser.id, 
            nickname: nickname || 'Anonym Resenär', 
            pin_emoji: pinEmoji,
            avatar_url: userAvatarUrl
          };
          alert('Profilen har sparats! 🎉');
          loadPins();
          closeProfileModal();
        }
      } catch (err) {
        console.error('❌ Profil-fel:', err);
        alert('Ett fel uppstod vid sparning');
      }
    }

    function normalizeLocationName(name) {
      return name
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }

    async function loadPins() {
      if (!supabaseClient) return;
      
      try {
        markersLayer.clearLayers();
        const { data: pins, error } = await supabaseClient.from('user_pins').select('*');
        if (error) {
          console.error('❌ Fel vid hämtning av tips:', error);
          return;
        }

        const locationsMap = {};
        pins.forEach(pin => {
          const key = pin.location_name;
          if (!locationsMap[key]) {
            locationsMap[key] = {
              display_name: pin.display_name,
              lat: pin.lat,
              lng: pin.lng,
              reviews: []
            };
          }
          locationsMap[key].reviews.push(pin);
        });

        Object.values(locationsMap).forEach(loc => {
          const marker = L.marker([loc.lat, loc.lng]).addTo(markersLayer);
          marker.on('click', () => showLocationDetails(loc));
        });

        console.log('✅ ' + pins.length + ' tips laddade');
      } catch (err) {
        console.error('❌ Tips-ladningsfel:', err);
      }
    }

    function openPinModal() {
      if (!currentUser && supabaseClient) {
        alert('Du måste logga in för att lägga till tips!');
        return loginWithGoogle();
      }
      document.getElementById('pin-form').classList.remove('hidden');
      document.getElementById('sheet-content').classList.add('hidden');
      document.getElementById('location-input').value = '';
      document.getElementById('review-input').value = '';
      updateCharCount();
      const sheet = document.getElementById('bottom-sheet');
      sheet.style.maxHeight = '98vh';
      sheet.classList.remove('translate-y-full');
    }

    function showLocationDetails(loc) {
      document.getElementById('pin-form').classList.add('hidden');
      document.getElementById('sheet-content').classList.remove('hidden');

      document.getElementById('sheet-title').innerText = loc.display_name;
      document.getElementById('sheet-subtitle').innerText = `${loc.reviews.length} resenär(er) har varit här`;
      
      const reviewsList = document.getElementById('reviews-list');
      reviewsList.innerHTML = '';

      // Hämta alla användarnamn och skapa en lista
      loc.reviews.forEach((review, index) => {
        const isOwner = currentUser && review.user_id === currentUser.id;
        
        // Användarnamn/header
        const userHeader = document.createElement('div');
        userHeader.className = 'bg-slate-800/60 border border-slate-700/60 rounded-2xl p-3 text-slate-200 cursor-pointer hover:bg-slate-800 transition';
        userHeader.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-semibold text-sm">👤 Resenär ${index + 1}</span>
            <span class="text-xs text-slate-400">${new Date(review.updated_at).toLocaleDateString()}</span>
          </div>
        `;
        
        userHeader.onclick = () => {
          // Toggle visa/dölj review för denna användare
          const detailsDiv = document.getElementById(`review-details-${index}`);
          if (detailsDiv) {
            detailsDiv.classList.toggle('hidden');
          }
        };
        
        reviewsList.appendChild(userHeader);

        // Review-detaljer (dölj initialt)
        const reviewDetails = document.createElement('div');
        reviewDetails.id = `review-details-${index}`;
        reviewDetails.className = 'hidden bg-slate-900/40 border-l-2 border-indigo-500 ml-4 pl-4 py-3 text-slate-300 text-sm mb-3 rounded';
        
        let ownerActions = '';
        if (isOwner) {
          ownerActions = `
            <div class="flex gap-2 mt-3 pt-3 border-t border-slate-700/40 text-xs">
              <button onclick="editPin('${review.location_name}', '${escapeHtml(review.review_text)}')" class="text-indigo-400 hover:text-indigo-300 font-medium cursor-pointer">✏️ Redigera</button>
              <span class="text-slate-600">|</span>
              <button onclick="deletePin('${review.location_name}')" class="text-rose-400 hover:text-rose-300 font-medium cursor-pointer">🗑️ Radera</button>
            </div>
          `;
        }
        
        reviewDetails.innerHTML = `
          <p class="whitespace-pre-wrap leading-relaxed mb-2">${escapeHtml(review.review_text)}</p>
          ${ownerActions}
        `;
        
        reviewsList.appendChild(reviewDetails);
      });

      const sheet = document.getElementById('bottom-sheet');
      sheet.style.maxHeight = '98vh';
      sheet.classList.remove('translate-y-full');
    }

    function editPin(locationName, text) {
      document.getElementById('sheet-content').classList.add('hidden');
      document.getElementById('pin-form').classList.remove('hidden');
      document.getElementById('location-input').value = locationName;
      document.getElementById('review-input').value = text;
      updateCharCount();
    }

    async function deletePin(locationName) {
      if (!currentUser) {
        alert('Du måste logga in för att radera tips!');
        return;
      }
      if (!confirm('Är du säker på att du vill radera ditt tip?')) return;

      try {
        const { error } = await supabaseClient
          .from('user_pins')
          .delete()
          .eq('user_id', currentUser.id)
          .eq('location_name', locationName);

        if (error) {
          alert('Kunde inte radera: ' + error.message);
        } else {
          alert('Tipet har raderats.');
          closeBottomSheet();
          loadPins();
        }
      } catch (err) {
        console.error('❌ Raderingsfel:', err);
        alert('Nätverksfel');
      }
    }

    function closeBottomSheet() {
      const sheet = document.getElementById('bottom-sheet');
      sheet.style.maxHeight = '98vh';
      sheet.classList.add('translate-y-full');
    }

    function updateCharCount() {
      const text = document.getElementById('review-input').value;
      if(text.length > 1000) {
        document.getElementById('review-input').value = text.substring(0, 1000);
      }
      document.getElementById('char-count').innerText = document.getElementById('review-input').value.length;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function savePin() {
      if (!supabaseClient) return alert('Supabase är inte konfigurerat!');
      if (!currentUser) return loginWithGoogle();

      const rawLocation = document.getElementById('location-input').value.trim();
      const review = document.getElementById('review-input').value.trim();

      if (!rawLocation || !review) return alert('Fyll i både plats och tip!');
      if (review.length > 1000) return alert('Tipet får max vara 1000 tecken!');

      const normalizedLocation = normalizeLocationName(rawLocation);

      const saveBtn = document.querySelector('#pin-form button[onclick="savePin()"]');
      const originalText = saveBtn.innerText;
      saveBtn.innerText = 'Letar koordinater...';
      saveBtn.disabled = true;

      try {
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(rawLocation)}`);
        const geoData = await geoRes.json();

        if (!geoData || geoData.length === 0) {
          alert('Kunde inte hitta platsen på kartan. Skriv tydligare (t.ex. "Larnaca").');
          saveBtn.innerText = originalText;
          saveBtn.disabled = false;
          return;
        }

        const lat = parseFloat(geoData[0].lat);
        const lng = parseFloat(geoData[0].lon);
        
        const displayName = (geoData[0].display_name) 
          ? geoData[0].display_name.split(',')[0] 
          : rawLocation;

        const { error } = await supabaseClient.from('user_pins').upsert({
          user_id: currentUser.id,
          location_name: normalizedLocation,
          display_name: displayName,
          review_text: review,
          lat: lat,
          lng: lng,
          updated_at: new Date().toISOString()
        }, { onConflict: 'user_id,location_name' });

        if (error) {
          alert('Ett fel uppstod: ' + error.message);
          console.error('Sparfel:', error);
        } else {
          alert('Ditt tip har sparats! 📍');
          closeBottomSheet();
          loadPins();
          map.setView([lat, lng], 6);
        }
      } catch (err) {
        console.error('❌ Nätverksfel:', err);
        alert('Ett nätverksfel uppstod.');
      } finally {
        saveBtn.innerText = originalText;
        saveBtn.disabled = false;
      }
    // Simple drag-to-resize för bottom-sheet
    let isDragging = false;
    let startY = 0;
    const sheet = document.getElementById('bottom-sheet');

    document.addEventListener('DOMContentLoaded', () => {
      const handle = sheet.querySelector('.bg-slate-800\\/50');
      if (handle) {
        handle.addEventListener('mousedown', (e) => {
          isDragging = true;
          startY = e.clientY;
          sheet.classList.remove('sheet-transition');
          e.preventDefault();
        });

        handle.addEventListener('touchstart', (e) => {
          isDragging = true;
          startY = e.touches[0].clientY;
          sheet.classList.remove('sheet-transition');
        });
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const diff = startY - e.clientY;
      const currentHeight = parseFloat(sheet.style.maxHeight) || 98;
      const newHeight = Math.min(98, Math.max(30, currentHeight + (diff / window.innerHeight) * 100));
      sheet.style.maxHeight = newHeight + 'vh';
      startY = e.clientY;
    });

    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const diff = startY - e.touches[0].clientY;
      const currentHeight = parseFloat(sheet.style.maxHeight) || 98;
      const newHeight = Math.min(98, Math.max(30, currentHeight + (diff / window.innerHeight) * 100));
      sheet.style.maxHeight = newHeight + 'vh';
      startY = e.touches[0].clientY;
    });

    document.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      sheet.classList.add('sheet-transition');
      
      const height = parseFloat(sheet.style.maxHeight) || 98;
      if (height > 80) sheet.style.maxHeight = '98vh';
      else if (height > 45) sheet.style.maxHeight = '65vh';
      else closeBottomSheet();
    });

    document.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      sheet.classList.add('sheet-transition');
      
      const height = parseFloat(sheet.style.maxHeight) || 98;
      if (height > 80) sheet.style.maxHeight = '98vh';
      else if (height > 45) sheet.style.maxHeight = '65vh';
      else closeBottomSheet();
    });
  </script>
</body>

<!DOCTYPE html>
<html lang="sv" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VistMe — Resenärernas Twitter (Beta)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #0b0f19; }
    #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1; background: #0b0f19; }
    .leaflet-tile-pane { filter: brightness(0.65) invert(1) contrast(1.5) hue-rotate(190deg) saturate(0.8); transition: filter 0.3s ease; }
    #intro-splash { transition: opacity 0.6s ease, transform 0.6s ease; }
    #intro-splash.fade-out { opacity: 0; transform: scale(1.05); pointer-events: none; }
    @keyframes wobble {
      0% { transform: rotate(0deg) scale(0.9); opacity: 0; }
      20% { transform: rotate(-3deg) scale(1); opacity: 1; }
      40% { transform: rotate(3deg); }
      60% { transform: rotate(-2deg); }
      80% { transform: rotate(1deg); }
      100% { transform: rotate(0deg); }
    }
    .postit-note {
      background: linear-gradient(135deg, #fef08a 0%, #facc15 85%, #eab308 100%);
      color: #0f172a;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 10px 15px rgba(0, 0, 0, 0.2);
      animation: wobble 0.8s ease-in-out forwards;
      border-radius: 0.75rem;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-full w-full relative">

  <div id="intro-splash" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-xl flex items-center justify-center p-4">
    <div class="bg-slate-900/80 border border-slate-800/80 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center space-y-6 relative overflow-hidden">
      <div class="inline-flex p-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 text-4xl shadow-inner">📌</div>
      <div class="space-y-2">
        <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-sky-300 to-cyan-400 bg-clip-text text-transparent">VistMe</h1>
        <p class="text-xs font-medium uppercase tracking-widest text-indigo-400/80">Resenärernas Twitter</p>
        <p class="text-sm text-slate-300 pt-2 leading-relaxed">Dela tillfälliga tips, upptäck platser och sätt dina egna Post-its på världskartan.</p>
      </div>
      <button onclick="closeIntroSplash()" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg cursor-pointer text-sm">Utforska kartan 🚀</button>
    </div>
  </div>

  <header class="absolute top-4 left-4 right-4 z-10 flex justify-between items-center bg-slate-900/90 backdrop-blur-md p-3 rounded-2xl border border-slate-800 shadow-xl">
    <div class="flex items-center gap-2 sm:gap-3">
      <span class="text-2xl">📌</span>
      <button onclick="openMyPinsModal()" class="text-xs bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 text-indigo-200 px-3 py-2 rounded-xl font-medium transition cursor-pointer shadow-md">📌 Mina Post-its</button>
      <button id="admin-reports-btn" onclick="openAdminModal()" class="hidden text-xs bg-rose-600/30 hover:bg-rose-600/50 border border-rose-500/40 text-rose-200 px-3 py-2 rounded-xl font-medium transition cursor-pointer shadow-md">🚨 Granska anmälningar</button>
      <select id="user-filter-select" onchange="filterPinsByUser(this.value)" class="text-xs bg-slate-800/90 border border-slate-700 text-indigo-200 px-3 py-2 rounded-xl font-medium transition cursor-pointer">
        <option value="all">🌐 Alla resenärer</option>
      </select>
    </div>
    <div class="flex items-center gap-2">
      <button id="login-btn" onclick="loginWithGoogle()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium cursor-pointer">Logga in med Google</button>
      <div id="user-profile" class="hidden flex items-center gap-2">
        <img id="header-avatar" src="" alt="Avatar" class="w-8 h-8 rounded-full border border-indigo-500/40 object-cover cursor-pointer" onclick="openProfileModal()">
        <button onclick="logout()" class="text-xs text-slate-400 hover:text-white cursor-pointer px-1">Logga ut</button>
      </div>
    </div>
  </header>

  <div id="map"></div>

  <button onclick="openPinModal()" class="fixed bottom-6 right-6 z-10 bg-indigo-600 hover:bg-indigo-500 text-white p-4 rounded-full shadow-2xl flex items-center gap-2 font-bold cursor-pointer">
    <span class="text-xl">✍️</span>
    <span class="hidden sm:inline">Skriv Post-it</span>
  </button>

  <div id="mypins-modal" class="fixed inset-0 z-30 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl max-h-[90vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden">
      <div class="p-5 border-b border-slate-800 flex justify-between items-center"><h2 class="text-xl font-bold text-indigo-300">Dina aktiva Post-its</h2><button onclick="closeMyPinsModal()" class="text-slate-400 cursor-pointer">✕</button></div>
      <div id="mypins-list-container" class="p-6 overflow-y-auto space-y-4 flex-1"></div>
      <div class="p-4 border-t border-slate-800 flex justify-end"><button onclick="closeMyPinsModal()" class="bg-slate-800 text-slate-300 px-5 py-2.5 rounded-xl text-sm cursor-pointer">Stäng</button></div>
    </div>
  </div>

  <div id="admin-reports-modal" class="fixed inset-0 z-30 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl max-h-[90vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden">
      <div class="p-5 border-b border-slate-800 flex justify-between items-center"><h2 class="text-xl font-bold text-rose-400">🚨 Anmälda inlägg</h2><button onclick="closeAdminModal()" class="text-slate-400 cursor-pointer">✕</button></div>
      <div id="admin-reports-container" class="p-6 overflow-y-auto space-y-4 flex-1"></div>
      <div class="p-4 border-t border-slate-800 flex justify-end"><button onclick="closeAdminModal()" class="bg-slate-800 text-slate-300 px-5 py-2.5 rounded-xl text-sm cursor-pointer">Stäng</button></div>
    </div>
  </div>

  <div id="pin-modal" class="fixed inset-0 z-30 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl shadow-2xl flex flex-col p-6">
      <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold text-indigo-300">Skriv din Post-it</h2><button onclick="closePinModal()" class="text-slate-400 cursor-pointer">✕</button></div>
      <div class="space-y-4 overflow-y-auto flex-1">
        <input type="text" id="location-input" placeholder="Stad / Plats" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white text-sm">
        <textarea id="review-like" maxlength="300" rows="2" placeholder="👍 Jag tycker..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white text-sm"></textarea>
        <textarea id="review-dislike" maxlength="300" rows="2" placeholder="👎 Jag tycker inte om..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white text-sm"></textarea>
        <textarea id="review-recommend" maxlength="300" rows="2" placeholder="⭐ Jag rekommenderar..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white text-sm"></textarea>
      </div>
      <div class="flex gap-3 mt-6 pt-4 border-t border-slate-800">
        <button onclick="savePin()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold cursor-pointer text-sm">Spara Post-it</button>
        <button onclick="closePinModal()" class="bg-slate-800 text-slate-300 px-5 py-3 rounded-xl text-sm cursor-pointer">Avbryt</button>
      </div>
    </div>
  </div>

  <div id="location-modal" class="fixed inset-0 z-30 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl max-h-[90vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden">
      <div class="p-5 border-b border-slate-800 flex justify-between items-center"><h2 id="location-modal-title" class="text-xl font-bold text-indigo-300">Plats</h2><button onclick="closeLocationModal()" class="text-slate-400 cursor-pointer">✕</button></div>
      <div id="location-reviews-list" class="p-6 overflow-y-auto space-y-4 flex-1"></div>
      <div class="p-4 border-t border-slate-800 flex justify-end"><button onclick="closeLocationModal()" class="bg-slate-800 text-slate-300 px-5 py-2.5 rounded-xl text-sm cursor-pointer">Stäng</button></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uzadvxbtgrkmuagjtkfr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_XGnBn__01QbbtlfOBOv2ng_EM8LrAXi';
    
    let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let map, currentUser = null, markersLayer = null, userProfile = null, editingPinId = null, allPinsData = [];

    window.addEventListener('DOMContentLoaded', () => {
      map = L.map('map', { zoomControl: false }).setView([20, 0], 3);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 15 }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
      setTimeout(() => map.invalidateSize(), 150);

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          currentUser = session.user;
          document.getElementById('login-btn').classList.add('hidden');
          document.getElementById('user-profile').classList.remove('hidden');
          if (session.user.user_metadata?.avatar_url) {
            document.getElementById('header-avatar').src = session.user.user_metadata.avatar_url;
          }
          fetchUserProfile(session.user.id);
        } else {
          currentUser = null;
          document.getElementById('login-btn').classList.remove('hidden');
          document.getElementById('user-profile').classList.add('hidden');
          document.getElementById('admin-reports-btn').classList.add('hidden');
        }
      });
      loadPins();
    });

    function closeIntroSplash() { document.getElementById('intro-splash').classList.add('fade-out'); setTimeout(() => document.getElementById('intro-splash').style.display = 'none', 600); }
    async function fetchUserProfile(userId) {
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', userId).single();
      if (data) {
        userProfile = data;
        if (data.role === 'admin' || data.role === 'super_admin') {
          document.getElementById('admin-reports-btn').classList.remove('hidden');
        }
      }
    }
    async function loginWithGoogle() { await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }); }
    async function logout() { await supabaseClient.auth.signOut(); window.location.reload(); }

    async function loadPins() {
      const { data: pins } = await supabaseClient.from('user_pins').select('*');
      const { data: profiles } = await supabaseClient.from('profiles').select('*');
      let profilesMap = {};
      if (profiles) profiles.forEach(p => profilesMap[p.id] = p);
      allPinsData = (pins || []).map(pin => ({ ...pin, profile: profilesMap[pin.user_id] || { nickname: 'Anonym', pin_emoji: '📍' } }));
      renderMapPins();
    }

    function renderMapPins() {
      markersLayer.clearLayers();
      let locationsMap = {};
      allPinsData.forEach(pin => {
        if (!locationsMap[pin.location_name]) locationsMap[pin.location_name] = { display_name: pin.display_name, lat: pin.lat, lng: pin.lng, reviews: [] };
        locationsMap[pin.location_name].reviews.push(pin);
      });
      Object.values(locationsMap).forEach(loc => {
        let emoji = loc.reviews[0].profile.pin_emoji || '📍';
        let marker = L.marker([loc.lat, loc.lng], { icon: L.divIcon({ html: `<div style="font-size:28px;">${emoji}</div>`, iconSize: [30,30], iconAnchor: [15,30] }) }).addTo(markersLayer);
        marker.on('click', () => showLocationDetails(loc));
      });
    }

    function showLocationDetails(loc) {
      document.getElementById('location-modal-title').innerText = loc.display_name;
      let list = document.getElementById('location-reviews-list');
      list.innerHTML = '';
      loc.reviews.forEach(review => {
        let isOwner = currentUser && review.user_id === currentUser.id;
        let isAdmin = userProfile && (userProfile.role === 'admin' || userProfile.role === 'super_admin');
        window._activeReviewsMap = window._activeReviewsMap || {};
        window._activeReviewsMap[review.id] = review;

        let div = document.createElement('div');
        div.className = 'bg-slate-800/60 p-4 rounded-2xl border border-slate-700/60 text-xs space-y-2';
        div.innerHTML = `
          <div class="font-bold text-indigo-400">${escapeHtml(review.profile.nickname)}</div>
          ${review.review_like ? `<div><strong class="text-indigo-400">👍:</strong> ${escapeHtml(review.review_like)}</div>` : ''}
          ${review.review_dislike ? `<div><strong class="text-rose-400">👎:</strong> ${escapeHtml(review.review_dislike)}</div>` : ''}
          ${review.review_recommend ? `<div><strong class="text-amber-400">⭐:</strong> ${escapeHtml(review.review_recommend)}</div>` : ''}
          ${isOwner || isAdmin ? `<div class="pt-2 border-t border-slate-700 flex gap-2">${isOwner ? `<button onclick="closeLocationModal(); editPinById(${review.id})" class="text-indigo-400 cursor-pointer">Redigera</button>` : ''}<button onclick="deletePin(${review.id})" class="text-rose-400 cursor-pointer">Radera</button></div>` : ''}
        `;
        list.appendChild(div);
      });
      document.getElementById('location-modal').classList.remove('hidden');
    }

    function editPinById(pinId) {
      let pin = window._activeReviewsMap[pinId];
      if (!pin) return;
      editingPinId = pin.id;
      document.getElementById('location-input').value = pin.display_name;
      document.getElementById('review-like').value = pin.review_like || '';
      document.getElementById('review-dislike').value = pin.review_dislike || '';
      document.getElementById('review-recommend').value = pin.review_recommend || '';
      document.getElementById('pin-modal').classList.remove('hidden');
    }

    async function deletePin(pinId) {
      if (!confirm('Radera denna Post-it?')) return;
      const { error } = await supabaseClient.from('user_pins').delete().eq('id', pinId);
      if (error) alert('Kunde inte radera: ' + error.message);
      else { alert('Raderat!'); loadPins(); closeLocationModal(); closeMyPinsModal(); }
    }

    async function savePin() {
      let rawLocation = document.getElementById('location-input').value.trim();
      let likeText = document.getElementById('review-like').value.trim();
      let dislikeText = document.getElementById('review-dislike').value.trim();
      let recommendText = document.getElementById('review-recommend').value.trim();
      if (!rawLocation) return alert('Skriv en plats!');

      let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(rawLocation)}`);
      let data = await res.json();
      if (!data || data.length === 0) return alert('Hittade inte platsen.');

      let payload = {
        user_id: currentUser.id,
        location_name: rawLocation.toLowerCase().replace(/[^a-z0-9]/g, ''),
        display_name: data[0].display_name.split(',')[0],
        review_like: likeText,
        review_dislike: dislikeText,
        review_recommend: recommendText,
        lat: parseFloat(data[0].lat),
        lng: parseFloat(data[0].lon),
        updated_at: new Date()
      };

      let err;
      if (editingPinId) {
        let q = await supabaseClient.from('user_pins').update(payload).eq('id', editingPinId);
        err = q.error;
      } else {
        let q = await supabaseClient.from('user_pins').insert(payload);
        err = q.error;
      }

      if (err) alert('Fel: ' + err.message);
      else { alert('Sparat!'); editingPinId = null; closePinModal(); loadPins(); }
    }

    function openPinModal() { editingPinId = null; document.getElementById('location-input').value = ''; document.getElementById('review-like').value = ''; document.getElementById('review-dislike').value = ''; document.getElementById('review-recommend').value = ''; document.getElementById('pin-modal').classList.remove('hidden'); }
    function closePinModal() { document.getElementById('pin-modal').classList.add('hidden'); }
    function closeLocationModal() { document.getElementById('location-modal').classList.add('hidden'); }
    async function openMyPinsModal() {
      document.getElementById('mypins-modal').classList.remove('hidden');
      let container = document.getElementById('mypins-list-container');
      container.innerHTML = 'Laddar...';
      const { data } = await supabaseClient.from('user_pins').select('*').eq('user_id', currentUser.id);
      container.innerHTML = '';
      (data || []).forEach(pin => {
        window._activeReviewsMap = window._activeReviewsMap || {};
        window._activeReviewsMap[pin.id] = pin;
        let d = document.createElement('div');
        d.className = 'bg-slate-800 p-4 rounded-xl text-xs space-y-2';
        d.innerHTML = `<div class="font-bold text-indigo-300">${escapeHtml(pin.display_name)}</div><div>${escapeHtml(pin.review_like || '')}</div><div class="flex gap-2 pt-2 border-t border-slate-700"><button onclick="closeMyPinsModal(); editPinById(${pin.id})" class="text-indigo-400 cursor-pointer">Redigera</button><button onclick="deletePin(${pin.id})" class="text-rose-400 cursor-pointer">Radera</button></div>`;
        container.appendChild(d);
      });
    }
    function closeMyPinsModal() { document.getElementById('mypins-modal').classList.add('hidden'); }
    function escapeHtml(text) { return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : ''; }
  </script>
</body>
</html>

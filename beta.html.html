<!DOCTYPE html>
<html lang="sv" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VistMe — Global Nomad Map (Beta)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0f19;
    }

    #map {
      height: 100vh;
      width: 100vw;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #0b0f19;
    }

    .leaflet-tile-pane {
      filter: brightness(0.65) invert(1) contrast(1.5) hue-rotate(190deg) saturate(0.8);
    }

    .sheet-transition { 
      transition: transform 0.3s ease-in-out; 
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-full w-full relative">

  <!-- Header / Top Bar -->
  <header class="absolute top-4 left-4 right-4 z-10 flex justify-between items-center bg-slate-900/90 backdrop-blur-md p-3 rounded-2xl border border-slate-800 shadow-xl">
    <div class="flex items-center gap-2">
      <span class="text-2xl">📌</span>
      <h1 class="font-bold text-xl tracking-wide bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">VistMe <span class="text-xs px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300">Beta</span></h1>
    </div>
    
    <div id="auth-section">
      <!-- Inloggningsknapp (visas som standard) -->
      <button id="login-btn" onclick="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg flex items-center gap-2 cursor-pointer">
        <span>Logga in med Google</span>
      </button>

      <!-- Profil- och utloggningssektion (dold som standard, visas vid inloggning) -->
      <div id="user-profile" class="hidden flex items-center gap-2 sm:gap-3">
        <span class="bg-amber-500/20 text-amber-400 text-xs px-2.5 py-1 rounded-full border border-amber-500/30 font-semibold">Pioneer</span>
        <button onclick="openProfileModal()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 text-indigo-300 px-3 py-1.5 rounded-xl font-medium transition cursor-pointer">Min Profil</button>
        <button onclick="logout()" class="text-xs text-slate-400 hover:text-white transition cursor-pointer">Logga ut</button>
      </div>
    </div>
  </header>

  <!-- Karta -->
  <div id="map"></div>

  <!-- Flytande Tum-knapp -->
  <button id="action-btn" onclick="openPinModal()" class="fixed bottom-6 right-6 z-10 bg-indigo-600 hover:bg-indigo-500 text-white p-4 rounded-full shadow-2xl flex items-center gap-2 font-bold transition transform active:scale-95 border border-indigo-400/30 cursor-pointer">
    <span class="text-xl">📍</span>
    <span class="hidden sm:inline">Sätt/Redigera Nål</span>
  </button>

  <!-- Bottom Sheet / Modal -->
  <div id="bottom-sheet" class="fixed inset-x-0 bottom-0 z-20 bg-slate-900 border-t border-slate-800 rounded-t-3xl p-6 shadow-2xl sheet-transition transform translate-y-full max-h-[85vh] overflow-y-auto">
    <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto mb-4 cursor-pointer" onclick="closeBottomSheet()"></div>
    
    <!-- Visar recensioner för en plats -->
    <div id="sheet-content">
      <h2 id="sheet-title" class="text-2xl font-bold mb-1">Välj en plats</h2>
      <p id="sheet-subtitle" class="text-slate-400 text-sm mb-4">Klicka på en nål för att läsa reviews</p>
      <div id="reviews-list" class="space-y-4"></div>
    </div>

    <!-- Formulär: Lägg till / Redigera nål -->
    <div id="pin-form" class="hidden space-y-4">
      <h2 id="form-title" class="text-xl font-bold">Lägg till / Redigera din Review</h2>
      <input type="text" id="location-input" placeholder="Stad/Plats (t.ex. Larnaca)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
      
      <div class="relative">
        <textarea id="review-input" maxlength="1000" rows="5" oninput="updateCharCount()" placeholder="Skriv din micro-review (Max 1 000 tecken)..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500"></textarea>
        <div class="text-right text-xs text-slate-500 mt-1">
          <span id="char-count">0</span> / 1000 tecken
        </div>
      </div>

      <div class="flex items-center gap-2 text-sm text-slate-300">
        <input type="checkbox" id="couch-check" class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
        <label for="couch-check">Erbjuder Soffa / Pitstop 🛋️</label>
      </div>

      <div class="flex gap-3">
        <button onclick="savePin()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition cursor-pointer">Spara Nål</button>
        <button onclick="closeBottomSheet()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-3 rounded-xl font-medium transition cursor-pointer">Avbryt</button>
      </div>
    </div>

    <!-- Formulär: Profil -->
    <div id="profile-form" class="hidden space-y-4">
      <h2 class="text-xl font-bold">Din Profil</h2>
      <p class="text-slate-400 text-sm">Här anger du ditt smeknamn som visas på dina nålar, samt valfri kontakt-e-post.</p>
      
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Nickname / Namn</label>
        <input type="text" id="profile-nickname" placeholder="t.ex. NomadJasmin" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Kontakt-e-post (Valfritt)</label>
        <input type="email" id="profile-email" placeholder="t.ex. du@example.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div class="flex gap-3 pt-2">
        <button onclick="saveProfile()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition cursor-pointer">Spara Profil</button>
        <button onclick="closeBottomSheet()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-3 rounded-xl font-medium transition cursor-pointer">Stäng</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uzadvxbtgrkmuagjtkfr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_XGnBn__01QbbtlfOBOv2ng_EM8LrAXi';
    
    let supabaseClient = null;
    let map = null;
    let currentUser = null;
    let markersLayer = null;
    let userProfile = null;

    if (SUPABASE_URL && SUPABASE_ANON_KEY) {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    window.addEventListener('DOMContentLoaded', () => {
      map = L.map('map', { 
        zoomControl: false,
        bounceAtZoomLimits: false
      }).setView([20, 0], 2);
      
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 17,
        maxNativeZoom: 15,
        minZoom: 2,
        attribution: 'Tiles &copy; Esri'
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      setTimeout(() => { map.invalidateSize(); }, 100);

      if (supabaseClient) {
        // Lyssna på inloggningsstatus dynamiskt
        supabaseClient.auth.onAuthStateChange((event, session) => {
          if (session) {
            currentUser = session.user;
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('user-profile').classList.remove('hidden');
            fetchUserProfile(session.user.id);
          } else {
            currentUser = null;
            document.getElementById('login-btn').classList.remove('hidden');
            document.getElementById('user-profile').classList.add('hidden');
          }
        });

        loadPins();
      }
    });

    async function fetchUserProfile(userId) {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', userId)
        .single();
      
      if (data) {
        userProfile = data;
      }
    }

    async function loginWithGoogle() {
      if (!supabaseClient) return alert('Supabase är inte konfigurerat!');
      const { error } = await supabaseClient.auth.signInWithOAuth({ 
        provider: 'google',
        options: { redirectTo: 'https://jstihl.github.io/vistme/' }
      });
      if (error) alert('Inloggning misslyckades: ' + error.message);
    }

    async function logout() {
      if (supabaseClient) await supabaseClient.auth.signOut();
      window.location.reload();
    }

    function normalizeLocationName(name) {
      return name
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }

    async function loadPins() {
      if (!supabaseClient) return;
      
      markersLayer.clearLayers();
      const { data: pins, error } = await supabaseClient.from('user_pins').select('*');
      if (error) return console.error('Kunde inte hämta nålar:', error);

      const { data: profiles } = await supabaseClient.from('profiles').select('*');
      const profilesMap = {};
      if (profiles) {
        profiles.forEach(p => { profilesMap[p.id] = p; });
      }

      const locationsMap = {};
      pins.forEach(pin => {
        const key = pin.location_name;
        if (!locationsMap[key]) {
          locationsMap[key] = {
            display_name: pin.display_name,
            lat: pin.lat,
            lng: pin.lng,
            reviews: []
          };
        }
        pin.profile = profilesMap[pin.user_id] || { nickname: 'Anonym Nomad' };
        locationsMap[key].reviews.push(pin);
      });

      Object.values(locationsMap).forEach(loc => {
        const marker = L.marker([loc.lat, loc.lng]).addTo(markersLayer);
        marker.on('click', () => showLocationDetails(loc));
      });
    }

    function openPinModal() {
      if (!currentUser && supabaseClient) return loginWithGoogle();
      document.getElementById('profile-form').classList.add('hidden');
      document.getElementById('pin-form').classList.remove('hidden');
      document.getElementById('sheet-content').classList.add('hidden');
      document.getElementById('location-input').value = '';
      document.getElementById('review-input').value = '';
      document.getElementById('couch-check').checked = false;
      updateCharCount();
      document.getElementById('bottom-sheet').classList.remove('translate-y-full');
    }

    function openProfileModal() {
      document.getElementById('pin-form').classList.add('hidden');
      document.getElementById('sheet-content').classList.add('hidden');
      document.getElementById('profile-form').classList.remove('hidden');

      if (userProfile) {
        document.getElementById('profile-nickname').value = userProfile.nickname || '';
        document.getElementById('profile-email').value = userProfile.contact_email || '';
      } else {
        document.getElementById('profile-nickname').value = '';
        document.getElementById('profile-email').value = '';
      }

      document.getElementById('bottom-sheet').classList.remove('translate-y-full');
    }

    async function saveProfile() {
      if (!currentUser) return;

      const nickname = document.getElementById('profile-nickname').value.trim();
      const contactEmail = document.getElementById('profile-email').value.trim();

      const { error } = await supabaseClient.from('profiles').upsert({
        id: currentUser.id,
        nickname: nickname || 'Anonym Nomad',
        contact_email: contactEmail,
        updated_at: new Date()
      });

      if (error) {
        alert('Kunde inte spara profil: ' + error.message);
      } else {
        alert('Profilen har sparats!');
        userProfile = { id: currentUser.id, nickname, contact_email: contactEmail };
        closeBottomSheet();
        loadPins();
      }
    }

    function showLocationDetails(loc) {
      document.getElementById('pin-form').classList.add('hidden');
      document.getElementById('profile-form').classList.add('hidden');
      document.getElementById('sheet-content').classList.remove('hidden');

      document.getElementById('sheet-title').innerText = loc.display_name;
      document.getElementById('sheet-subtitle').innerText = `${loc.reviews.length} nomad(er) har besökt denna plats`;
      
      const reviewsList = document.getElementById('reviews-list');
      reviewsList.innerHTML = '';

      loc.reviews.forEach(review => {
        const isOwner = currentUser && review.user_id === currentUser.id;
        const authorName = review.profile && review.profile.nickname ? review.profile.nickname : 'Anonym Nomad';
        const contactInfo = review.profile && review.profile.contact_email 
          ? `<div class="text-xs text-indigo-300 mt-1">Kontakt: <a href="mailto:${review.profile.contact_email}" class="underline">${review.profile.contact_email}</a></div>` 
          : '';

        const reviewCard = document.createElement('div');
        reviewCard.className = 'bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 text-slate-200 relative';
        
        let ownerActions = '';
        if (isOwner) {
          ownerActions = `
            <div class="flex gap-2 mt-3 pt-3 border-t border-slate-700/40 text-xs">
              <button onclick="editPin('${review.location_name}', '${escapeHtml(review.review_text)}', ${review.has_couch})" class="text-indigo-400 hover:text-indigo-300 font-medium cursor-pointer">Redigera</button>
              <span class="text-slate-600">|</span>
              <button onclick="deletePin('${review.location_name}')" class="text-rose-400 hover:text-rose-300 font-medium cursor-pointer">Radera</button>
            </div>
          `;
        }

        reviewCard.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-sm text-indigo-400">${escapeHtml(authorName)}</span>
            <span class="text-xs text-slate-400">${new Date(review.updated_at).toLocaleDateString()}</span>
          </div>
          <div class="mb-2">
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300">${review.has_couch ? '🛋️ Erbjuder Soffa' : '📍 Besökare'}</span>
          </div>
          <p class="whitespace-pre-wrap leading-relaxed text-sm">${escapeHtml(review.review_text)}</p>
          ${contactInfo}
          ${ownerActions}
        `;
        reviewsList.appendChild(reviewCard);
      });

      document.getElementById('bottom-sheet').classList.remove('translate-y-full');
    }

    function editPin(locationName, text, hasCouch) {
      document.getElementById('sheet-content').classList.add('hidden');
      document.getElementById('profile-form').classList.add('hidden');
      document.getElementById('pin-form').classList.remove('hidden');
      document.getElementById('location-input').value = locationName;
      document.getElementById('review-input').value = text;
      document.getElementById('couch-check').checked = hasCouch;
      updateCharCount();
    }

    async function deletePin(locationName) {
      if (!confirm('Är du säker på att du vill radera din nål för denna plats?')) return;

      const { error } = await supabaseClient
        .from('user_pins')
        .delete()
        .eq('user_id', currentUser.id)
        .eq('location_name', locationName);

      if (error) {
        alert('Kunde inte radera: ' + error.message);
      } else {
        alert('Nålen har raderats.');
        closeBottomSheet();
        loadPins();
      }
    }

    function closeBottomSheet() {
      document.getElementById('bottom-sheet').classList.add('translate-y-full');
    }

    function updateCharCount() {
      const text = document.getElementById('review-input').value;
      if(text.length > 1000) {
        document.getElementById('review-input').value = text.substring(0, 1000);
      }
      document.getElementById('char-count').innerText = document.getElementById('review-input').value.length;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function savePin() {
      if (!supabaseClient) return alert('Supabase är inte konfigurerat!');
      if (!currentUser) return loginWithGoogle();

      const rawLocation = document.getElementById('location-input').value.trim();
      const review = document.getElementById('review-input').value.trim();
      const hasCouch = document.getElementById('couch-check').checked;

      if (!rawLocation || !review) return alert('Fyll i både plats och review!');
      if (review.length > 1000) return alert('Review får max vara 1000 tecken!');

      const normalizedLocation = normalizeLocationName(rawLocation);

      const saveBtn = document.querySelector('#pin-form button[onclick="savePin()"]');
      const originalText = saveBtn.innerText;
      saveBtn.innerText = 'Letar koordinater...';
      saveBtn.disabled = true;

      try {
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(rawLocation)}`);
        const geoData = await geoRes.json();

        if (!geoData || geoData.length === 0) {
          alert('Kunde inte hitta platsen på kartan. Skriv tydligare (t.ex. "Larnaca").');
          saveBtn.innerText = originalText;
          saveBtn.disabled = false;
          return;
        }

        const lat = parseFloat(geoData[0].lat);
        const lng = parseFloat(geoData[0].lon);
        
        const displayName = (geoData[0].display_name) 
          ? geoData[0].display_name.split(',')[0] 
          : rawLocation;

        const { error } = await supabaseClient.from('user_pins').upsert({
          user_id: currentUser.id,
          location_name: normalizedLocation,
          display_name: displayName,
          review_text: review,
          has_couch: hasCouch,
          lat: lat,
          lng: lng,
          updated_at: new Date()
        }, { onConflict: 'user_id, location_name' });

        if (error) {
          alert('Ett fel uppstod: ' + error.message);
        } else {
          alert('Din nål har sparats!');
          closeBottomSheet();
          loadPins();
          map.setView([lat, lng], 6);
        }
      } catch (err) {
        console.error(err);
        alert('Nätverksfel.');
      } finally {
        saveBtn.innerText = originalText;
        saveBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
